<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shelter — Add Animal</title>
  <style>
    body { font-family: sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    nav { background: #f1f5f9; padding: 0.6rem 1rem; border-radius: 6px; margin-bottom: 1.5rem; }
    nav a { margin-right: 1rem; text-decoration: none; color: #2563eb; }
    nav a:hover { text-decoration: underline; }
    h1 { border-bottom: 2px solid #333; padding-bottom: 0.4rem; }
    form { display: grid; gap: 0.5rem; max-width: 480px; margin-top: 1rem; }
    label { font-weight: bold; }
    input, select, textarea { padding: 0.4rem; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; }
    button { padding: 0.6rem 1.2rem; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; width: fit-content; }
    button:hover { background: #1d4ed8; }
    .back-link { display: inline-block; margin-top: 1rem; color: #2563eb; }
    .error { color: red; font-weight: bold; margin: 0; }
  </style>
</head>
<body>

  <nav>
    <a href="/">Home</a>
    <a href="/animals">All animals</a>
    <a href="/animals/new">Add animal</a>
  </nav>

  <main>
    <h1>Add a new animal</h1>
    <form th:action="@{/animals}" th:object="${form}" method="post">

      <label for="name">Name</label>
      <input th:field="*{name}" id="name" type="text" required placeholder="e.g. Milo">
      <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</p>

      <label for="type">Type</label>
      <select th:field="*{type}" id="type" required>
        <option value="">— choose —</option>
        <option value="CAT">Cat</option>
        <option value="DOG">Dog</option>
        <option value="OTHER">Other</option>
      </select>
      <p class="error" th:if="${#fields.hasErrors('type')}" th:errors="*{type}">Type error</p>

      <label for="breed">Breed</label>
      <input th:field="*{breed}" id="breed" type="text" placeholder="e.g. Siamese">

      <label for="age">Age (years)</label>
      <input th:field="*{age}" id="age" type="number" min="0" placeholder="e.g. 3">
      <p class="error" th:if="${#fields.hasErrors('age')}" th:errors="*{age}">Age error</p>

      <label for="description">Description</label>
      <textarea th:field="*{description}" id="description" rows="3"
                placeholder="A short description of the animal's personality"></textarea>

      <label for="imageUrl">Image filename</label>
      <input th:field="*{imageUrl}" id="imageUrl" type="text"
             placeholder="luna.jpg">

      <button type="submit">Add animal</button>
    </form>

    <a href="/animals" class="back-link">← Back to list</a>
  </main>

</body>
</html>

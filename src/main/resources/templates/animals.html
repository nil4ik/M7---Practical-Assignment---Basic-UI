<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shelter Animals</title>
  <style>
    body { font-family: sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
    h1 { border-bottom: 2px solid #333; padding-bottom: 0.4rem; }
    h2 { margin-top: 2rem; }
    ul { list-style: none; padding: 0; }
    li { border: 1px solid #ddd; border-radius: 6px; padding: 1rem; margin-bottom: 1rem; display: flex; gap: 1rem; align-items: flex-start; }
    li img { border-radius: 4px; }
    .info { flex: 1; }
    .status-available { color: green; font-weight: bold; }
    .status-adopted   { color: #999;  font-weight: bold; }
    form { display: grid; gap: 0.5rem; max-width: 480px; margin-top: 1rem; }
    label { font-weight: bold; }
    input, select, textarea { padding: 0.4rem; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; }
    button { padding: 0.6rem 1.2rem; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; width: fit-content; }
    button:hover { background: #1d4ed8; }
    nav { background: #f1f5f9; padding: 0.6rem 1rem; border-radius: 6px; margin-bottom: 1.5rem; }
    nav a { margin-right: 1rem; text-decoration: none; color: #2563eb; }
    nav a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<nav>
  <a href="/">Home</a>
  <a href="/animals">All animals</a>
  <a href="/animals/new">Add animal</a>
</nav>
  <main>
    <h1>Shelter Animals</h1>
    <p>
      Developer? See the
      <a th:href="@{/swagger-ui/index.html}">API documentation (Swagger UI)</a>.
    </p>
    <section aria-label="Animal list">
      <ul>
        <li th:each="animal : ${animals}">
          <img th:src="${animal.imageUrl}"
               th:alt="${animal.name}"
               width="300"
               height="200"
               style="object-fit: cover;">
          <div class="info">
            <strong th:text="${animal.name}">Name</strong> —
            <span th:text="${animal.type}">Type</span> |
            <span th:text="${animal.breed}">Breed</span> |
            Age: <span th:text="${animal.age}">0</span>
            <span th:text="${animal.status}"
                  th:class="${animal.status.name() == 'AVAILABLE'} ? 'status-available' : 'status-adopted'">AVAILABLE</span>
            <p th:text="${animal.description}">Description</p>
          </div>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
